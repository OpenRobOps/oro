# Full Mosquitto configuration (broker settings + MongoDB credentials), held
# in a single Secret because the file embeds credentials. The deployment
# mounts this Secret as one file at /etc/mosquitto/mosquitto.conf.
#
# Workflow:
#   1. cp secret.example.yaml secret.yaml
#   2. Replace every <...> placeholder with a real value.
#   3. kubectl apply -f secret.yaml
#
# secret.yaml is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: mosquitto-config
  namespace: oro
  labels:
    app.kubernetes.io/name: mosquitto
type: Opaque
stringData:
  mosquitto.conf: |
    # Listeners ────────────────────────────────────────────
    # Plain MQTT (cluster-internal use: oro-app, oro-ingest, health probes).
    listener 1883
    protocol mqtt

    # MQTTS — public listener used by the InOrbit agent. The agent
    # hardcodes TLS for any non-localhost broker hostname (see
    # inorbit/link.py: `if hostname not in ("localdev.com","localhost")`),
    # so external traffic must be TLS-terminated. The certificate is
    # issued by cert-manager (k8s/mosquitto/certificate.yaml) and lands
    # in the `mqtt-oro-inorbit-ai-tls` Secret, mounted at /etc/mosquitto/certs.
    listener 8883
    protocol mqtt
    certfile /etc/mosquitto/certs/tls.crt
    keyfile /etc/mosquitto/certs/tls.key

    # Plain WebSockets — kept for cluster-internal use. Modern browsers
    # loaded over https:// refuse ws://, so external browser clients use
    # the wss listener below.
    listener 9001
    protocol websockets

    # WSS — public WebSockets-over-TLS for browser MQTT clients (e.g.
    # mqtt.js in the oro-app SPA). Same cert as the 8883 MQTTS listener.
    listener 9443
    protocol websockets
    certfile /etc/mosquitto/certs/tls.crt
    keyfile /etc/mosquitto/certs/tls.key

    # Authentication ───────────────────────────────────────
    allow_anonymous false

    # Plugin: mosquitto-go-auth ────────────────────────────
    plugin /mosquitto/go-auth.so

    auth_opt_backends mongo
    auth_opt_hasher pbkdf2
    auth_opt_hasher_algorithm sha512
    auth_opt_hasher_iterations 100000
    auth_opt_hasher_salt_size 16
    auth_opt_hasher_keylen 64
    auth_opt_hasher_salt_encoding base64
    auth_opt_cache false

    # MongoDB backend ──────────────────────────────────────
    # Same database as the app's MONGO_URL (the oro-app seeds the
    # mqtt_credentials collection here).
    # NOTE use auth_opt_mongo_uri instead of host, port, username and password to connect to clusters (mongodb:+srv format)
    auth_opt_mongo_host <mongodb-service>.oro.svc.cluster.local
    auth_opt_mongo_port 27017
    auth_opt_mongo_dbname oro
    auth_opt_mongo_users mqtt_credentials
    auth_opt_mongo_aclquery db.mqtt_credentials.findOne({username: "%s"})
    auth_opt_mongo_disable_superuser false
    auth_opt_mongo_username <mongodb-user>
    auth_opt_mongo_password <mongodb-password>
    auth_opt_mongo_authsource admin

    # Logging ──────────────────────────────────────────────
    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    connection_messages true
