name: Tests

on:
  push:
    paths: 
    - .github/workflows/test-ingest.yaml
    - 'ingest/**'
    # Include all files copied by import.sh
    - 'app/imports/shared/**'
    - 'app/private/oro.proto'

#   pull_request:
    # types:
    # - synchronize

jobs:

  test-ingest:
    name: Ingest Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # mongo-unit needs libssl1.1
      - name: Install libssl1.1
        run: |
          wget https://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          rm libssl1.1_1.1.1f-1ubuntu2_amd64.deb

      - name: Cache .npm directory
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ingest/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('ingest/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # TODO(iso-sdk-registry): remove once @openrobops/iso21423 is published and the file: link is flipped (Plan 5 Task 8).
      - name: "Build the ISO 21423 SDK (file: dependency)"
        env:
          ISO_SDK_READ_TOKEN: ${{ secrets.ISO_SDK_READ_TOKEN }}
        run: |
          # iso21243 is private: read via the ISO_SDK_READ_TOKEN fine-grained PAT (contents: read).
          git clone --depth 1 "https://x-access-token:${ISO_SDK_READ_TOKEN}@github.com/OpenRobOps/iso21243" ../iso21423
          cd ../iso21423/ts-sdk
          npm ci
          npm run build

      - name: Install dependencies [if not cached]
        working-directory: ingest
        run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'

      # A cached node_modules may predate the SDK sibling (npm skips a missing file: optionalDependency
      # silently), so link it explicitly; idempotent when npm ci already created the symlink.
      - name: Link the ISO SDK into node_modules [cache-safe]
        working-directory: ingest
        run: npm install --no-save ../../iso21423/ts-sdk

      - name: Import shared code
        working-directory: ingest
        run: ./import.sh

      - name: Run tests
        working-directory: ingest
        run: npm run test:unit:report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ingest
          path: ingest/junit_ingest.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: ingest/junit_ingest.xml
          reporter: java-junit
