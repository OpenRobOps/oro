# Mosquitto configuration with mosquitto-go-auth plugin
# For use with iegomez/mosquitto-go-auth Docker image

# ── Listeners ──────────────────────────────────────────
listener 1883
protocol mqtt

listener 9001
protocol websockets

# ── Authentication ─────────────────────────────────────
allow_anonymous false

# ── Plugin: mosquitto-go-auth ──────────────────────────
plugin /mosquitto/go-auth.so

auth_opt_backends mongo
auth_opt_hasher pbkdf2
auth_opt_hasher_algorithm sha512
auth_opt_hasher_iterations 100000
auth_opt_hasher_salt_size 16
auth_opt_hasher_keylen 64
auth_opt_hasher_salt_encoding base64
auth_opt_cache false

# ── MongoDB backend ───────────────────────────────────
auth_opt_mongo_uri mongodb://localhost:3001
auth_opt_mongo_dbname meteor
auth_opt_mongo_users mqtt_credentials
auth_opt_mongo_aclquery db.mqtt_credentials.findOne({username: "%s"})
auth_opt_mongo_disable_superuser false

# ── Logging ────────────────────────────────────────────
log_dest stdout
log_type all
connection_messages true
