# Sample secret. DO NOT commit a copy with real values.
#
# Workflow:
#   1. cp secret.example.yaml secret.yaml
#   2. Replace every <...> placeholder with a real value.
#   3. kubectl apply -f secret.yaml
#
# public.oauthProviders lists the login methods offered on the login page.
# Keep it consistent with the rest of the settings: "email" needs smtp.url,
# and each OAuth provider needs its oauth.<provider> credentials. (The server
# hides advertised methods whose configuration is missing.)
#
# The .gitignore in this directory excludes secret.yaml.
#
# stringData lets you write values verbatim; Kubernetes encodes them to base64
# at apply time. For pre-encoded values, use `data:` instead.
apiVersion: v1
kind: Secret
metadata:
  name: oro-app-secrets
  namespace: oro
  labels:
    app.kubernetes.io/name: oro-app
type: Opaque
stringData:
  # MongoDB connection string. Examples:
  #   mongodb://<user>:<password>@<host>:27017/oro?authSource=admin
  #   mongodb+srv://<user>:<password>@<cluster>.mongodb.net/oro
  MONGO_URL: "mongodb://<user>:<password>@<mongodb-host>:27017/oro?authSource=admin"

  # The image's entrypoint exports MAIL_URL automatically from the
  # METEOR_SETTINGS.smtp.url field below — leave this commented unless you
  # have a reason to bypass that path.
  # MAIL_URL: "smtp://<user>:<password>@<smtp-host>:587"

  # METEOR_SETTINGS is the JSON payload normally written to settings.json.
  # Generate locally with `scripts/generate-settings.sh` (Terraform-backed) and
  # paste the result here. The structure below mirrors what server/main.js
  # reads.
  METEOR_SETTINGS: |
    {
      "mqtt": {
        "brokers": {
          "local": {
            "hostname": "<mqtt-host>",
            "port": 1883,
            "protocol": "mqtt://",
            "username": "<mqtt-user>",
            "password": "<mqtt-password>",
            "websocket_port": 9001,
            "websocket_protocol": "ws://"
          }
        },
        "credentialEncryptionKey": "<32 hex chars — openssl rand -hex 16>",
        "defaultBrokerId": "local",
        "masterCredentials": {
          "username": "<mqtt-master-user>",
          "password": "<mqtt-master-password>"
        }
      },
      "oauth": {
        "github": {
          "clientId": "<github-oauth-client-id>",
          "secret": "<github-oauth-client-secret>",
          "loginStyle": "popup"
        },
        "google": {
          "clientId": "<google-oauth-client-id>",
          "secret": "<google-oauth-client-secret>",
          "loginStyle": "popup"
        }
      },
      "peerKey": "<64 hex chars — openssl rand -hex 32>",
      "public": {
        "oauthProviders": ["email", "google", "github"]
      },
      "robotApiKeys": ["<long-random-string-per-fleet>"],
      "smtp": {
        "url": "smtp://<user>:<password>@<smtp-host>:587"
      }
    }
