name: Build oro-ingest image

# - Push to main / version tags  → build, push to ghcr.io
# - Pull request                 → build only (no push)
# - workflow_dispatch            → same as push to main
#
# oro-ingest has no HTTP port or HEALTHCHECK and crash-loops without a live
# mongo + mqtt stack, so there is no image smoke test here (unlike oro-app).
# A successful build is the gate; behavioural coverage lives in test-ingest.yaml.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "ingest/**"
      # Shared sources copied into the build context by ingest/import.sh
      - "app/imports/shared/**"
      - "app/private/oro.proto"
      - "scripts/build-ingest-image.sh"
      - ".github/workflows/build-ingest-image.yml"
  workflow_dispatch:

concurrency:
  group: build-ingest-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build oro-ingest image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build context is ingest/, so the shared files from app/ must be
      # materialized into ingest/src/shared before the context is sent to the
      # daemon — same step test-ingest.yaml runs. See ingest/import.sh.
      - name: Import shared code
        working-directory: ingest
        run: ./import.sh

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/oro-ingest
          flavor: latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      # On a version tag, ingest/package.json must match the tag — the image
      # reports its version from package.json at runtime (src/lib/version.js).
      # The Release workflow keeps them in sync automatically; this guards the
      # manual `git tag` path (RELEASING.md Path B).
      - name: Verify package.json matches release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_ver="${{ steps.meta.outputs.version }}"
          pkg_ver="$(node -p "require('./ingest/package.json').version")"
          if [ "$tag_ver" != "$pkg_ver" ]; then
            echo "::error::ingest/package.json version ($pkg_ver) != release tag ($tag_ver). Bump package.json or cut the release via the Release workflow."
            exit 1
          fi
          echo "ingest/package.json matches tag: $pkg_ver"

      # Build into the local daemon first; on PRs this is the whole job (no
      # push). The layer cache is shared with the push step below.
      #
      # Layer cache lives in GHCR (:buildcache tag), not in the Actions cache —
      # see the identical block in build-app-image.yml for the full rationale
      # (10GB Actions-cache quota thrash, 0% hit rate, ~5 min gha export tax).
      - name: Build (load to local daemon)
        uses: docker/build-push-action@v7
        with:
          context: ingest
          file: ingest/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/openrobops/oro-ingest:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=ghcr.io/openrobops/oro-ingest:buildcache,mode=max,image-manifest=true' || '' }}

      # Every tag is already in the local daemon from the build step above, so
      # we just push them. Retry the push so a transient registry error
      # (e.g. a GHCR 5xx/timeout) doesn't fail a release. Re-pushing an
      # already-pushed tag is idempotent.
      - name: Push to GHCR (retry on transient registry errors)
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          push_all() {
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              docker push "$tag" || return 1
            done <<< "$TAGS"
          }
          for attempt in 1 2 3; do
            if push_all; then
              echo "Pushed all tags on attempt $attempt."
              exit 0
            fi
            echo "::warning::push attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "::error::push failed after 3 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## oro-ingest image build"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Ref:   \`${{ github.ref }}\`"
            echo ""
            echo "### Tags"
            echo '```'
            printf '%s\n' "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo ""
              echo "Pushed to \`ghcr.io/${{ github.repository_owner }}/oro-ingest\`."
            else
              echo ""
              echo "PR build — image was built but not pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
