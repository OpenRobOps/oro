# Full ingest configuration (settings.json), held in a Secret because it
# embeds MongoDB, MQTT, and peer-API credentials. The deployment mounts this
# Secret as one file at /app/settings.json.
#
# The structure mirrors what ingest/src/main.js reads. Generate the
# canonical values locally with `scripts/generate-settings.sh` (Terraform-
# backed) and paste them in here.
#
# The "iso21423" block below is rendered disabled. For the enabled shape
# (imrfmId, broker, ccs, credentials) see docs/iso21423-robots.md.
#
# Workflow:
#   1. cp secret.example.yaml secret.yaml
#   2. Replace every <...> placeholder with a real value.
#   3. kubectl apply -f secret.yaml
#
# secret.yaml is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: oro-ingest-config
  namespace: oro
  labels:
    app.kubernetes.io/name: oro-ingest
type: Opaque
stringData:
  settings.json: |
    {
      "mongo": {
        "url": "mongodb://<user>:<password>@<mongodb-host>:27017/oro?authSource=admin",
        "db": "oro",
        "options": {
          "connectTimeoutMS": 5000,
          "maxPoolSize": 10
        }
      },
      "mqtt": {
        "brokers": {
          "local": {
            "hostname": "mosquitto.oro.svc.cluster.local",
            "port": 1883,
            "protocol": "mqtt://",
            "username": "ingest-master",
            "password": "<mqtt-master-password>",
            "websocket_port": 9001,
            "websocket_protocol": "ws://"
          }
        },
        "defaultBrokerId": "local"
      },
      "peerClient": {
        "url": "http://oro-app.oro.svc.cluster.local/",
        "peerKey": "<64 hex chars — must match METEOR_SETTINGS.peerKey in oro-app>",
        "connectionPooling": true
      },
      "profiler": {
        "enabled": false
      },
      "iso21423": {
        "robots": { "enabled": false },
        "upstream": { "enabled": false }
      }
    }
