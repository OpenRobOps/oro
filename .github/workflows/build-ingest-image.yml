name: Build oro-ingest image

# - Push to main / version tags  → build, push to ghcr.io
# - Pull request                 → build only (no push)
# - workflow_dispatch            → same as push to main
#
# oro-ingest has no HTTP port or HEALTHCHECK and crash-loops without a live
# mongo + mqtt stack, so there is no image smoke test here (unlike oro-app).
# A successful build is the gate; behavioural coverage lives in test-ingest.yaml.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "ingest/**"
      # Shared sources copied into the build context by ingest/import.sh
      - "app/imports/shared/**"
      - "app/private/oro.proto"
      - "scripts/build-ingest-image.sh"
      - ".github/workflows/build-ingest-image.yml"
  workflow_dispatch:

concurrency:
  group: build-ingest-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build oro-ingest image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build context is ingest/, so the shared files from app/ must be
      # materialized into ingest/src/shared before the context is sent to the
      # daemon — same step test-ingest.yaml runs. See ingest/import.sh.
      - name: Import shared code
        working-directory: ingest
        run: ./import.sh

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/oro-ingest
          flavor: latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ingest
          file: ingest/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "## oro-ingest image build"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Ref:   \`${{ github.ref }}\`"
            echo ""
            echo "### Tags"
            echo '```'
            printf '%s\n' "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo ""
              echo "Pushed to \`ghcr.io/${{ github.repository_owner }}/oro-ingest\`."
            else
              echo ""
              echo "PR build — image was built but not pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
